name: 스타트업 투자유치 브리핑

on:
  schedule:
    - cron: "43 23 * * 0-4"   # 평일 한국시간 08:43
  workflow_dispatch:
    inputs:
      hours:
        description: "최근 몇 시간 기사를 볼지 (기본 24, 월요일은 72 추천)"
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          HOURS="${{ github.event.inputs.hours }}"
          if [ -z "$HOURS" ]; then
            if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then HOURS=72; else HOURS=24; fi
          fi
          python main.py --hours "$HOURS"
      - name: Save log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily briefing"
          git push
